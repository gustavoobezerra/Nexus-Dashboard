# Feito por Gustavo Bezerra
# Configuração de deploy para Render.com

services:
  # Backend - API Python/Flask
  - type: web
    name: nexus-dashboard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # Frontend - React/Vite (Static Site)
  - type: web
    name: nexus-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
